name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - release
      - develop
  pull_request:
    branches:
      - main
      - release
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para desplegar (develop/release/prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - release
          - prd

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate
        
  security-scan:
    name: Security Scan with Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Run Checkov Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: false
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    # Modificado: Ejecutar también para push
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    
    # Determinamos el environment basado en el contexto
    environment:
      name: ${{ github.event.inputs.environment || (github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prd' || (github.base_ref == 'release' && 'release' || 'develop'))) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' && 'prd' || (github.ref == 'refs/heads/release' && 'release' || 'develop'))) || 'develop' }}
    
    concurrency:
      group: terraform-${{ github.event.inputs.environment || (github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prd' || (github.base_ref == 'release' && 'release' || 'develop'))) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' && 'prd' || (github.ref == 'refs/heads/release' && 'release' || 'develop'))) || 'develop' }}
      cancel-in-progress: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Determinar ambiente y archivo de estado
        id: env_selection
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              echo "ENVIRONMENT=prd" >> $GITHUB_ENV
              echo "KEY=prd.tfstate" >> $GITHUB_ENV
            elif [[ "${{ github.base_ref }}" == "release" ]]; then
              echo "ENVIRONMENT=release" >> $GITHUB_ENV
              echo "KEY=release.tfstate" >> $GITHUB_ENV
            else
              echo "ENVIRONMENT=dev" >> $GITHUB_ENV
              echo "KEY=dev.tfstate" >> $GITHUB_ENV
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "ENVIRONMENT=prd" >> $GITHUB_ENV
              echo "KEY=prd.tfstate" >> $GITHUB_ENV
            elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
              echo "ENVIRONMENT=release" >> $GITHUB_ENV
              echo "KEY=release.tfstate" >> $GITHUB_ENV
            else
              echo "ENVIRONMENT=dev" >> $GITHUB_ENV
              echo "KEY=dev.tfstate" >> $GITHUB_ENV
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            if [[ "${{ github.event.inputs.environment }}" == "prd" ]]; then
              echo "KEY=prd.tfstate" >> $GITHUB_ENV
            elif [[ "${{ github.event.inputs.environment }}" == "release" ]]; then
              echo "KEY=release.tfstate" >> $GITHUB_ENV
            else
              echo "KEY=dev.tfstate" >> $GITHUB_ENV
            fi
          fi
        
      - name: Terraform Init
        id: init
        env:
          # Usamos los secrets del environment específico
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_LOG: INFO
        run: |
          terraform init \
            -backend-config="key=${KEY}"

      - name: Terraform Plan
        id: plan
        env:
          # Usamos los secrets del environment específico
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_LOG: INFO
        run: |
          terraform plan \
            -var-file=env/${ENVIRONMENT}.tfvars \
            -out=tfplan

      - name: Publicar Plan de Terraform como Artefacto
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: tfplan
          retention-days: 7

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    # Determinamos el environment basado en el contexto
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || (github.ref == 'refs/heads/release' && 'release' || 'develop')) }}
    
    concurrency:
      group: terraform-apply-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || (github.ref == 'refs/heads/release' && 'release' || 'develop')) }}
      cancel-in-progress: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Determinar ambiente y archivo de estado
        id: env_selection
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "ENVIRONMENT=prd" >> $GITHUB_ENV
              echo "KEY=prd.tfstate" >> $GITHUB_ENV
            elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
              echo "ENVIRONMENT=release" >> $GITHUB_ENV
              echo "KEY=release.tfstate" >> $GITHUB_ENV
            else
              echo "ENVIRONMENT=dev" >> $GITHUB_ENV
              echo "KEY=dev.tfstate" >> $GITHUB_ENV
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            if [[ "${{ github.event.inputs.environment }}" == "prd" ]]; then
              echo "KEY=prd.tfstate" >> $GITHUB_ENV
            elif [[ "${{ github.event.inputs.environment }}" == "release" ]]; then
              echo "KEY=release.tfstate" >> $GITHUB_ENV
            else
              echo "KEY=dev.tfstate" >> $GITHUB_ENV
            fi
          fi

      - name: Terraform Init
        id: init
        env:
          # Usamos los secrets del environment específico
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_LOG: INFO
        run: |
          terraform init \
            -backend-config="key=${KEY}"

      - name: Terraform Plan
        id: plan
        env:
          # Usamos los secrets del environment específico
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_LOG: INFO
        run: |
          terraform plan \
            -var-file=env/${ENVIRONMENT}.tfvars \
            -out=tfplan

      - name: Terraform Apply
        id: apply
        env:
          # Usamos los secrets del environment específico
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_LOG: INFO
        run: |
          terraform apply tfplan

      - name: Publicar Estado de Terraform como Artefacto
        uses: actions/upload-artifact@v4.6.1
        with:
          name: terraform-state-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: |
            terraform.tfstate
            terraform.tfstate.backup
          retention-days: 30
