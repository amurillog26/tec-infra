name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - release
      - develop
  pull_request:
    branches:
      - main
      - release
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para desplegar (develop/release/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - release
          - prod

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate
        
  security-scan:
    name: Security Scan with Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Run Checkov Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: false
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    # Solo ejecutar plan en pull requests
    if: github.event_name == 'pull_request'
    
    # Para PR, usar el environment de la rama destino para obtener secrets
    environment:
      name: ${{ github.base_ref }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Set Environment Variables
        run: |
          # Determinar configuración basada en la rama destino del PR
          case "${{ github.base_ref }}" in
            main)
              echo "TF_ENV=prod" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=tfstateprodgptoai" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_prod" >> $GITHUB_ENV
              echo "STATE_KEY=prod.tfstate" >> $GITHUB_ENV
              ;;
            release)
              echo "TF_ENV=release" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=tfstatepprdgptoai" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_pprd" >> $GITHUB_ENV
              echo "STATE_KEY=release.tfstate" >> $GITHUB_ENV
              ;;
            *)
              echo "TF_ENV=dev" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=stgpttfstates01" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_dev" >> $GITHUB_ENV
              echo "STATE_KEY=dev.tfstate" >> $GITHUB_ENV
              ;;
          esac
        
      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT }}" \
            -backend-config="key=${{ env.STATE_KEY }}"

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform plan -var-file=env/${{ env.TF_ENV }}.tfvars

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    # Ejecutar apply en push (merge) o workflow_dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    # Para push, usar el nombre de la rama como environment
    # Para workflow_dispatch, mapear el input a la rama correspondiente
    environment:
      name: ${{ github.event_name == 'push' && github.ref_name || (github.event.inputs.environment == 'prod' && 'main' || github.event.inputs.environment == 'dev' && 'develop' || 'release') }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Set Environment Variables
        run: |
          # Para push, usar la rama actual
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${{ github.ref_name }}"
          # Para workflow_dispatch, mapear el input
          else
            case "${{ github.event.inputs.environment }}" in
              prod) BRANCH="main" ;;
              release) BRANCH="release" ;;
              *) BRANCH="develop" ;;
            esac
          fi
          
          # Configurar variables basadas en la rama
          case "$BRANCH" in
            main)
              echo "TF_ENV=prod" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=tfstateprodgptoai" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_prod" >> $GITHUB_ENV
              echo "STATE_KEY=prod.tfstate" >> $GITHUB_ENV
              ;;
            release)
              echo "TF_ENV=release" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=tfstatepprdgptoai" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_pprd" >> $GITHUB_ENV
              echo "STATE_KEY=release.tfstate" >> $GITHUB_ENV
              ;;
            *)
              echo "TF_ENV=dev" >> $GITHUB_ENV
              echo "STORAGE_ACCOUNT=stgpttfstates01" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=rg_gpt_oai_dev" >> $GITHUB_ENV
              echo "STATE_KEY=dev.tfstate" >> $GITHUB_ENV
              ;;
          esac

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT }}" \
            -backend-config="key=${{ env.STATE_KEY }}"

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform apply -var-file=env/${{ env.TF_ENV }}.tfvars -auto-approve
